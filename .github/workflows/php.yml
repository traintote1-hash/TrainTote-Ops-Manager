name: PHP checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Lint tracked PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(git ls-files -z -- '*.php')
          if (( ${#php_files[@]} == 0 )); then
            echo "No tracked PHP files found."
            exit 1
          fi
          for file in "${php_files[@]}"; do
            php -l "$file"
          done

      - name: Run Operations generator test
        shell: bash
        run: |
          set -euo pipefail
          test_file="operations/tests/generator_test.php"
          if [[ -f "$test_file" ]]; then
            php "$test_file"
          else
            echo "$test_file is not present on this branch; it will run when introduced."
          fi
