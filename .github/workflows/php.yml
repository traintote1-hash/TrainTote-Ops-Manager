name: PHP checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Lint tracked PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(git ls-files -z -- '*.php')
          if (( ${#php_files[@]} == 0 )); then
            echo "No tracked PHP files found."
            exit 1
          fi
          for file in "${php_files[@]}"; do
            php -l "$file"
          done

      - name: Run Operations regression tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(find operations/tests -maxdepth 1 -name '*_test.php' -type f | sort)
          if (( ${#test_files[@]} == 0 )); then
            echo "No Operations regression tests found."
            exit 1
          fi
          for test_file in "${test_files[@]}"; do
            php "$test_file"
          done

      - name: Run shared application regression tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(find tests -maxdepth 1 -name '*_test.php' -type f | sort)
          if (( ${#test_files[@]} == 0 )); then
            echo "No shared application regression tests found."
            exit 1
          fi
          for test_file in "${test_files[@]}"; do
            php "$test_file"
          done
